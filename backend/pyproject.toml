[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-tracker-backend"
dynamic = ["version"]
description = "Local-first Finance Tracker API foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142.2,<0.143",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "ofxtools>=1.0,<2",
  "keyring>=25.6,<26",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.1,<3",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
path = "app/_version.py"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "app/_version.py" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
